name: Verify public HTTPS site

on:
  workflow_dispatch:
    inputs:
      site:
        description: Public HTTPS address
        required: true
        default: https://obihush.site
  push:
    branches: [codex/obhush-deployment]
    paths:
      - .github/workflows/public-site.yml

permissions:
  contents: read

jobs:
  public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read public deployment version
        id: observed
        env:
          PUBLIC_SITE_URL: ${{ inputs.site || 'https://obihush.site' }}
        run: |
          node --input-type=module <<'JS'
          import { appendFile } from 'node:fs/promises';
          let version='unreachable';
          try {
            const response=await fetch(new URL('/api/health',process.env.PUBLIC_SITE_URL),{signal:AbortSignal.timeout(12000)});
            const body=await response.json();
            if(Number.isInteger(body.interfaceVersion))version=String(body.interfaceVersion);
          } catch {}
          await appendFile(process.env.GITHUB_OUTPUT,`version=${version}\n`);
          JS
      - name: Observed public interface (${{ steps.observed.outputs.version }})
        run: echo 'The version was read from the public health endpoint.'
      - name: Verify TLS, API, interface assets and terrain from an external network
        env:
          PUBLIC_SITE_URL: ${{ inputs.site || 'https://obihush.site' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';
          import { appendFile } from 'node:fs/promises';
          process.on('uncaughtException',error=>{console.error('::error::'+String(error.message).replace(/[\r\n]/g,' ').slice(0,500));process.exit(1);});

          const base = new URL(process.env.PUBLIC_SITE_URL);
          assert.equal(base.protocol, 'https:');
          assert.equal(base.username + base.password, '');
          async function get(path, timeout=12000) {
            const response = await fetch(new URL(path, base), {
              signal: AbortSignal.timeout(timeout), redirect: 'error',
            });
            assert.equal(response.status, 200, `GET ${path}`);
            return response;
          }
          let health;
          let lastError;
          for (let attempt = 0; attempt < 18; attempt++) {
            try {
              health = await (await get('/api/health')).json();
              assert.equal(health.status, 'ok');
              assert.equal(health.service, 'obhush');
              assert.ok(health.interfaceVersion >= 3, 'Waiting for the everyday service update');
              break;
            } catch (error) {
              health = undefined;
              lastError = error;
              console.log(`Waiting for public HTTPS: attempt ${attempt + 1}/18`);
              if (attempt < 17) await delay(10000);
            }
          }
          if (!health) throw lastError;

          const data = await (await get('/api/data')).json();
          assert.equal(data.snapshot.weather.length, 3);
          const series = data.snapshot.river.daily;
          assert.ok(series.time.length >= 180);
          assert.equal(series.river_discharge.length, series.time.length);

          const html = await (await get('/')).text();
          assert.match(html, /<div id="root">/);
          assert.match(html, /ОБҲУШ/);
          assert.match(html, /Вода\. Погода\. Жизнь/);
          const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map(match => match[1]);
          assert.ok(assets.some(path => path.endsWith('.js')));
          assert.ok(assets.some(path => path.endsWith('.css')));
          for (const asset of assets) {
            const response = await get(asset);
            assert.doesNotMatch(response.headers.get('content-type') || '', /text\/html/);
            assert.ok((await response.arrayBuffer()).byteLength > 0);
          }
          const terrain = await (await get('/terrain.json')).json();
          assert.equal(terrain.width * terrain.height, 30720);
          const geography = await (await get('/geography.json')).json();
          assert.ok(geography && typeof geography === 'object');
          const font = await get('/fonts/Manrope.ttf');
          assert.ok((await font.arrayBuffer()).byteLength > 1000);
          const relief = await get('/relief.webp');
          assert.match(relief.headers.get('content-type') || '', /image\/webp/);
          assert.ok((await relief.arrayBuffer()).byteLength > 1000);
          for (const city of ['dushanbe','khujand']) {
            const payload = await (await get('/api/weather?city='+city,25000)).json();
            assert.equal(payload.weather.place.id,city);
            assert.equal(payload.stale,false,'Fresh weather must be available for '+city);
            assert.ok(Number.isFinite(payload.weather.current.temperature));
            assert.equal(payload.weather.days.length,7);
            assert.ok(Date.now()-Date.parse(payload.weather.current.at)<45*60000);
          }
          for (const variant of ['desktop','mobile']) {
            const video = await fetch(new URL('/media/garden-'+variant+'.mp4',base),{headers:{Range:'bytes=0-1023'},signal:AbortSignal.timeout(12000)});
            assert.equal(video.status,206);assert.equal((await video.arrayBuffer()).byteLength,1024);
          }
          assert.ok((await (await get('/fonts/Lora.ttf')).arrayBuffer()).byteLength>1000);

          const summary = `Public HTTPS verified: ${base.origin}\n` +
            `Certificate validation enabled; health and data APIs work; ${assets.length} interface assets, terrain and font load.\n` +
            `Weather points: ${data.snapshot.weather.length}; river days: ${series.time.length}; data retrieved: ${data.snapshot.retrievedAt}.\n` +
            `Current city weather and both video byte ranges verified. External assistant key configured: ${Boolean(health.assistantAvailable)}. No basin refresh request was made.\n`;
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          JS
      - name: Ask one everyday planning question through the public assistant
        id: assistant
        env:
          PUBLIC_SITE_URL: ${{ inputs.site || 'https://obihush.site' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFile } from 'node:fs/promises';
          const base = new URL(process.env.PUBLIC_SITE_URL);
          const health = await fetch(new URL('/api/health', base), { signal: AbortSignal.timeout(12000) }).then(r => r.json());
          const response = await fetch(new URL('/api/advice', base), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            signal: AbortSignal.timeout(45000),
            body: JSON.stringify({
              message: 'Объясни кратко, как этот расчёт помогает семье беречь воду, без промежуточной арифметики.', language:'ru',role:'family',location:{city:'dushanbe'},
              garden:{area:50,coefficient:.85,efficiency:.9,useRain:true},
              family:{people:4,showerMinutes:8,flow:9,loadsPerWeek:3,litresPerLoad:45},duration:2,
            }),
          });
          assert.equal(response.status, 200);
          const result = await response.json();
          assert.ok(['llm', 'local'].includes(result.mode));
          assert.equal(typeof result.answer, 'string');
          assert.ok(result.answer.length >= 24);
          assert.ok((result.answer.match(/[А-Яа-яЁё]/g) || []).length >= 5);
          await appendFile(process.env.GITHUB_OUTPUT, `mode=${result.mode}\nconfigured=${Boolean(health.assistantAvailable)}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            `\nPublic everyday assistant returned a localized planning answer. Mode: ${result.mode}; external key configured: ${Boolean(health.assistantAvailable)}.\n`);
          JS
      - name: Assistant verified (mode=${{ steps.assistant.outputs.mode }}, key configured=${{ steps.assistant.outputs.configured }})
        run: echo 'Public assistant verification completed.'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify the real public desktop and mobile interface
        env:
          PUBLIC_SITE_URL: ${{ inputs.site || 'https://obihush.site' }}
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            CHROMIUM_PATH="$(command -v google-chrome)" node scripts/check-public-everyday.mjs
          else
            npx playwright install --with-deps chromium
            node scripts/check-public-everyday.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-everyday-interface
          path: artifacts/public-*.png
          if-no-files-found: ignore
          retention-days: 7
