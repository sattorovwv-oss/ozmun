name: Verify public HTTPS site

on:
  workflow_dispatch:
    inputs:
      site:
        description: Public HTTPS address
        required: true
        default: https://obihush.site
  push:
    branches: [codex/obhush-deployment]
    paths:
      - .github/workflows/public-site.yml

permissions: {}

jobs:
  public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify TLS, API, interface assets and terrain from an external network
        env:
          PUBLIC_SITE_URL: ${{ inputs.site || 'https://obihush.site' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';
          import { appendFile } from 'node:fs/promises';

          const base = new URL(process.env.PUBLIC_SITE_URL);
          assert.equal(base.protocol, 'https:');
          assert.equal(base.username + base.password, '');
          async function get(path) {
            const response = await fetch(new URL(path, base), {
              signal: AbortSignal.timeout(12000), redirect: 'error',
            });
            assert.equal(response.status, 200, `GET ${path}`);
            return response;
          }
          let health;
          let lastError;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              health = await (await get('/api/health')).json();
              assert.equal(health.status, 'ok');
              assert.equal(health.service, 'obhush');
              assert.ok(health.interfaceVersion >= 2, 'Waiting for the water-safety interface update');
              break;
            } catch (error) {
              health = undefined;
              lastError = error;
              console.log(`Waiting for public HTTPS: attempt ${attempt + 1}/12`);
              if (attempt < 11) await delay(10000);
            }
          }
          if (!health) throw lastError;

          const data = await (await get('/api/data')).json();
          assert.equal(data.snapshot.weather.length, 3);
          const series = data.snapshot.river.daily;
          assert.ok(series.time.length >= 180);
          assert.equal(series.river_discharge.length, series.time.length);

          const html = await (await get('/')).text();
          assert.match(html, /<div id="root">/);
          assert.match(html, /ОБҲУШ/);
          assert.match(html, /Вода и безопасность/);
          const assets = [...html.matchAll(/(?:src|href)="(\/assets\/[^"]+)"/g)].map(match => match[1]);
          assert.ok(assets.some(path => path.endsWith('.js')));
          assert.ok(assets.some(path => path.endsWith('.css')));
          for (const asset of assets) {
            const response = await get(asset);
            assert.doesNotMatch(response.headers.get('content-type') || '', /text\/html/);
            assert.ok((await response.arrayBuffer()).byteLength > 0);
          }
          const terrain = await (await get('/terrain.json')).json();
          assert.equal(terrain.width * terrain.height, 30720);
          const geography = await (await get('/geography.json')).json();
          assert.ok(geography && typeof geography === 'object');
          const font = await get('/fonts/Manrope.ttf');
          assert.ok((await font.arrayBuffer()).byteLength > 1000);
          const relief = await get('/relief.webp');
          assert.match(relief.headers.get('content-type') || '', /image\/webp/);
          assert.ok((await relief.arrayBuffer()).byteLength > 1000);

          const summary = `Public HTTPS verified: ${base.origin}\n` +
            `Certificate validation enabled; health and data APIs work; ${assets.length} interface assets, terrain and font load.\n` +
            `Weather points: ${data.snapshot.weather.length}; river days: ${series.time.length}; data retrieved: ${data.snapshot.retrievedAt}.\n` +
            `External assistant key configured: ${Boolean(health.assistantAvailable)}. No assistant requests or data refreshes were made.\n`;
          console.log(summary);
          if (process.env.GITHUB_STEP_SUMMARY) await appendFile(process.env.GITHUB_STEP_SUMMARY, summary);
          JS
      - name: Ask one water-safety question through the public assistant
        id: assistant
        env:
          PUBLIC_SITE_URL: ${{ inputs.site || 'https://obihush.site' }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFile } from 'node:fs/promises';
          const base = new URL(process.env.PUBLIC_SITE_URL);
          const health = await fetch(new URL('/api/health', base), { signal: AbortSignal.timeout(12000) }).then(r => r.json());
          const data = await fetch(new URL('/api/data', base), { signal: AbortSignal.timeout(12000) }).then(r => r.json());
          const response = await fetch(new URL('/api/assistant', base), {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            signal: AbortSignal.timeout(35000),
            body: JSON.stringify({
              message: 'Что означают осадки в Раште? Может ли эта система точно предсказать сель?', language: 'ru',
              monitoring: { pointId:'rasht', date:data.snapshot.today, addedRain:0 },
              parameters: { capacity:4500, initialStorage:2790, release:650, inflowChange:0,
                irrigationDemand:350, head:220, efficiency:.9, turbineLimit:1400,
                area:80, evaporation:2.5, reservePercent:30 },
            }),
          });
          assert.equal(response.status, 200);
          const result = await response.json();
          assert.ok(['llm', 'local'].includes(result.mode));
          assert.equal(typeof result.answer, 'string');
          assert.ok(result.answer.length >= 24);
          assert.ok((result.answer.match(/[А-Яа-яЁё]/g) || []).length >= 5);
          assert.doesNotMatch(result.answer, /\d+(?:[.,]\d+)?\s*%/);
          await appendFile(process.env.GITHUB_OUTPUT, `mode=${result.mode}\nconfigured=${Boolean(health.assistantAvailable)}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY,
            `\nPublic assistant returned a localized water-safety answer without an invented risk percentage. Mode: ${result.mode}; external key configured: ${Boolean(health.assistantAvailable)}.\n`);
          JS
      - name: Assistant verified (mode=${{ steps.assistant.outputs.mode }}, key configured=${{ steps.assistant.outputs.configured }})
        run: echo 'Public assistant verification completed.'
